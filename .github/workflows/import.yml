name: Import and verify Stratum Frame

on:
  push:
    branches: [main]
    paths: ['.github/workflows/import.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore checksum-verified complete source
        shell: bash
        run: |
          cat .import/source.*.xz > "$RUNNER_TEMP/stratum-source.tar.xz"
          echo "34ba7f91b7f2dab6474f3730e87d13e4b1909caa6f370f569b8e07f4ff1bcabd  $RUNNER_TEMP/stratum-source.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/stratum-source.tar.xz" --no-same-owner
      - name: Verify structural engine and build portable application
        shell: bash
        run: |
          npm test | tee docs/node-test-output.txt
          npm run verify
          npm run build:pages
      - name: Commit expanded application and remove transport files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .import
          git add -A -- . ':!.github'
          git commit -m "Import complete Stratum Frame application, examples and analytical verification"
          git push origin HEAD:main
      - name: Install pinned browser-test tooling
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Run interaction suite and regenerate screenshots
        run: python tools/browser_smoke.py --inline
      - name: Commit browser verification and workspace screenshots
        shell: bash
        run: |
          git add docs/browser-results.json docs/screenshot-*.png
          git diff --cached --quiet || git commit -m "Record Chromium interaction verification and workspace screenshots"
          git push origin HEAD:main
